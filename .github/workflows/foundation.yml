name: Foundation checks
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
      - run: npm run smoke:dev
      - run: npm run smoke:living
      - name: Review artifacts only (no deployment)
        uses: actions/upload-artifact@v4
        with:
          name: living-ocean-v1-review
          path: |
            dist/
            test-results/

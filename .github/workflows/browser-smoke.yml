name: ASCean Browser Smoke
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Desktop and mobile smoke
        run: node site/browser-smoke.mjs
      - name: Public original Anatomy editor smoke (no Pages deployment)
        env:
          PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
        run: node site/anatomy-preview-smoke.mjs

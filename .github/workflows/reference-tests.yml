name: Reference Mechanics CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check site/shared/world-prototype.mjs
          node --check site/lab/lab.mjs
          node --check site/hub/hub.mjs
          node --check site/hub/mini-tanks.mjs
      - name: Algorithmic correctness tests
        run: |
          node --test site/shared/world-prototype.test.mjs
          node --test site/shared/mini-ecosystem-prototype.test.mjs site/shared/dev-register.test.mjs
